<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<rect width="1200" height="800" fill="#fff"/><style>
.title{font:bold 22px Arial;fill:#183153}.head{font:bold 18px Arial;fill:#183153}.body{font:14px Arial;fill:#202a35}.line{stroke:#52677f;stroke-width:2;fill:none}.sep{stroke:#9aa9b8;stroke-width:1}.box{stroke:#52677f;stroke-width:2;rx:4}
</style>
<text x="600" y="35" text-anchor="middle" class="title">Electronic — Diagrama de Classes UML</text>
<rect class="box" x="430" y="70" width="340" height="230" fill="#d5e8d4"/><text x="600" y="100" text-anchor="middle" class="head">Pessoa (classe base)</text><line class="sep" x1="430" y1="115" x2="770" y2="115"/><text x="450" y="145" class="body">Atributos</text><text x="450" y="168" class="body">- nome: String</text><text x="450" y="190" class="body">- endereco: Endereco</text><line class="sep" x1="430" y1="205" x2="770" y2="205"/><text x="450" y="230" class="body">+ Pessoa(nome, endereco)</text><text x="450" y="252" class="body">+ getters/setters de nome e endereco</text><text x="450" y="274" class="body">+ exibirDados(): String</text>
<rect class="box" x="55" y="390" width="385" height="230" fill="#fff2cc"/><text x="247" y="420" text-anchor="middle" class="head">PessoaFisica</text><line class="sep" x1="55" y1="435" x2="440" y2="435"/><text x="75" y="465" class="body">Atributos</text><text x="75" y="488" class="body">- cpf: String</text><text x="75" y="510" class="body">- dataNascimento: String</text><line class="sep" x1="55" y1="525" x2="440" y2="525"/><text x="75" y="550" class="body">+ PessoaFisica(...)</text><text x="75" y="573" class="body">+ getters/setters de cpf e dataNascimento</text><text x="75" y="596" class="body">+ exibirDados(): String</text>
<rect class="box" x="760" y="390" width="385" height="230" fill="#f8cecc"/><text x="952" y="420" text-anchor="middle" class="head">PessoaJuridica</text><line class="sep" x1="760" y1="435" x2="1145" y2="435"/><text x="780" y="465" class="body">Atributos</text><text x="780" y="488" class="body">- cnpj: String</text><text x="780" y="510" class="body">- razaoSocial: String</text><line class="sep" x1="760" y1="525" x2="1145" y2="525"/><text x="780" y="550" class="body">+ PessoaJuridica(...)</text><text x="780" y="573" class="body">+ getters/setters de cnpj e razaoSocial</text><text x="780" y="596" class="body">+ exibirDados(): String</text>
<rect class="box" x="430" y="390" width="340" height="230" fill="#e1d5e7"/><text x="600" y="420" text-anchor="middle" class="head">Endereco</text><line class="sep" x1="430" y1="435" x2="770" y2="435"/><text x="450" y="465" class="body">Atributos</text><text x="450" y="488" class="body">- logradouro: String</text><text x="450" y="510" class="body">- numero: String</text><text x="450" y="532" class="body">- cidade: String</text><text x="450" y="554" class="body">- uf: String</text><line class="sep" x1="430" y1="568" x2="770" y2="568"/><text x="450" y="594" class="body">+ construtor, getters/setters, toString()</text>
<path class="line" d="M247 390 L247 340 L520 340 L520 300"/><path class="line" d="M952 390 L952 340 L680 340 L680 300"/><path class="line" d="M600 300 L600 390"/>
<polygon points="520,300 512,315 528,315" fill="#fff" stroke="#52677f" stroke-width="2"/><polygon points="680,300 672,315 688,315" fill="#fff" stroke="#52677f" stroke-width="2"/>
<text x="330" y="330" class="body">herança</text><text x="820" y="330" class="body">herança</text><text x="615" y="350" class="body">1 : 1</text>
<rect x="250" y="670" width="700" height="70" rx="5" fill="#fff2cc" stroke="#d6b656"/><text x="600" y="698" text-anchor="middle" class="body">Notação UML: + público | - privado | # protegido</text><text x="600" y="722" text-anchor="middle" class="body">No JavaScript, os atributos privados são declarados com #.</text>
</svg>